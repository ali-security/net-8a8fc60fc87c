# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own TryBot/LUCI infrastructure), so this workflow is written from
# scratch. It packages the module zip exactly as the module proxy does and runs
# the project's own test suite (`go test ./...`) on Linux, macOS and Windows.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated Go test names to run instead of the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have. .gitignore and .gitattributes are
      # kept: they ARE part of the published module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: |
          set -eux
          go build ./...

      # `go test` is silent about individual tests unless -v is given, so run
      # verbose into a file and print the per-package result lines plus a
      # passed/failed/skipped test count; the full log is dumped on failure.
      - name: Test
        run: |
          # Actions runs `shell: bash` with -e; turn it off so the go test exit
          # code is captured and re-raised after the summary is printed.
          set +e -x
          if [ -n "${{ inputs.test-filter }}" ]; then
            go test -v -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))\$" ./... > "$RUNNER_TEMP/test.log" 2>&1
          else
            go test -v ./... > "$RUNNER_TEMP/test.log" 2>&1
          fi
          rc=$?
          set +x
          if [ "$rc" -ne 0 ]; then
            cat "$RUNNER_TEMP/test.log"
          fi
          echo "===== per-package results ====="
          grep -E '^(ok|FAIL|\?)[[:space:]]' "$RUNNER_TEMP/test.log"
          echo "===== failed tests ====="
          grep -E -- '--- FAIL:' "$RUNNER_TEMP/test.log"
          echo "===== summary ====="
          echo "tests passed:  $(grep -cE -- '--- PASS:' "$RUNNER_TEMP/test.log")"
          echo "tests failed:  $(grep -cE -- '--- FAIL:' "$RUNNER_TEMP/test.log")"
          echo "tests skipped: $(grep -cE -- '--- SKIP:' "$RUNNER_TEMP/test.log")"
          echo "go test exit code: $rc"
          exit "$rc"
